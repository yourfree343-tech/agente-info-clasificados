<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>{% block title %}Archivo Clasificado{% endblock %}</title>
{% set detective = pagina in ('investigaciones', 'conexiones') %}
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23{{ '9b8cff' if detective else 'd8a24a' }}'/%3E%3Ccircle cx='16' cy='16' r='6.2' fill='none' stroke='%230a0d12' stroke-width='3.2'/%3E%3C/svg%3E">
<script>
  /* Tema antes de pintar nada (evita el destello del tema equivocado al cargar). */
  (function () { try { var t = localStorage.getItem('tema'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
<link rel="preload" href="/static/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/fonts.css">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="{{ 'detective-page' if detective else '' }}">

<nav class="topbar" aria-label="Principal">
  <a class="nav-brand" href="/" aria-label="Archivo Clasificado — inicio">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect class="bm-bg" width="32" height="32" rx="7"/>
      <circle class="bm-ring" cx="16" cy="16" r="6.2" fill="none" stroke-width="3.2"/>
    </svg>
    <span class="brand-text">Archivo<span class="sep">·</span>Clasificado</span>
  </a>
  <div class="nav-tabs">
    <a class="nav-tab {{ 'active' if pagina == 'documentos' }}" href="/" {% if pagina == 'documentos' %}aria-current="page"{% endif %}><span data-icon="folder"></span>Documentos</a>
    <a class="nav-tab {{ 'active' if pagina == 'investigaciones' }}" href="/investigaciones" {% if pagina == 'investigaciones' %}aria-current="page"{% endif %}><span data-icon="search"></span>Investigaciones</a>
    <a class="nav-tab {{ 'active' if pagina == 'conexiones' }}" href="/conexiones" {% if pagina == 'conexiones' %}aria-current="page"{% endif %}><span data-icon="network"></span>Conexiones</a>
  </div>
  <div class="nav-right">
    {% block nav_status %}{% endblock %}
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar tema">
      <span class="ico-luna" data-icon="moon"></span><span class="ico-sol" data-icon="sun"></span>
    </button>
  </div>
</nav>

<main class="container">
{% block content %}{% endblock %}
</main>

<script src="/static/js/icons.js"></script>
<script src="/static/js/common.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
